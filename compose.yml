services:
  parameter-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parameter-store
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: "/app/data"
      PARAMETER_STORE_KEY_FILE: "/run/secrets/parameter-store.key"
      PARAMETER_STORE_API_KEY_FILE: "/run/secrets/parameter-store-api.key"
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data:/app/data
      - ./parameter-store.key:/run/secrets/parameter-store.key:ro
      - ./parameter-store-api.key:/run/secrets/parameter-store-api.key:ro
